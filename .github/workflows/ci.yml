name: CI

# The project argues that an eval should be a gate rather than a dashboard.
# This is what makes that true: every push runs the suite AND the regression
# gate, so a prompt edit that quietly breaks the hard cases fails the build
# instead of shipping.
#
# No API key is needed. The agent falls back to a deterministic baseline
# policy, which is the whole reason that baseline exists.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant; don't burn minutes on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Keep CI runs out of the trace store's default path handling and make the
  # run identifiable if traces are ever inspected from an artifact.
  AGENT_RUN_LABEL: ci-${{ github.run_number }}

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version rather than stopping at the first failure --
      # "3.11 broke, 3.13 fine" is a different bug from "all broke".
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Verify router selection is still RNG-identical
        # Invariant 1 in AGENTS.md. A test covers it, but surfacing the actual
        # numbers in the log means a reviewer can see the benchmark is still
        # reproducible without digging into pytest output.
        run: |
          python - <<'PY'
          from src.simulator import run_once, SimConfig
          from src.gateways import default_fleet
          from src.routers import ThompsonRouter

          result = run_once(
              lambda n, s: ThompsonRouter(n, gamma=0.999, seed=s),
              default_fleet(), SimConfig(transactions=50_000), 0,
          )
          sr, regret = round(result.realised_sr, 5), round(result.total_regret, 1)
          print(f"realised_sr={sr}  total_regret={regret}")
          assert (sr, regret) == (0.94916, 532.5), (
              f"router RNG consumption changed: got {(sr, regret)}, "
              f"expected (0.94916, 532.5). The README's benchmark numbers were "
              f"measured before the constraint layer added parameters to select(); "
              f"see invariant 1 in AGENTS.md."
          )
          print("OK - benchmark numbers remain reproducible")
          PY

  eval-gate:
    name: eval regression gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore simulated telemetry
        uses: actions/cache@v4
        with:
          path: results/eval_cache
          # Telemetry is deterministic given these files. Anything that changes
          # fleet definitions, incident parameters, volume, seed, or the router
          # used to generate it must produce a new key -- otherwise stale
          # telemetry gets graded against new ground truth.
          key: eval-cache-v2-${{ hashFiles('src/agent/evals/cases.py', 'src/gateways.py', 'src/simulator.py', 'src/routers/*.py', 'src/metrics.py') }}

      - name: Run the eval suite and gate
        # Cold cache builds six weeks of transactions (~100s); warm is <1s.
        run: python run_evals.py --gate | tee eval-output.txt

      - name: Publish results to the run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          report = pathlib.Path("results/eval_report.json")
          if not report.exists():
              summary.write_text("## Eval gate\n\nNo report produced - the run failed early.\n")
              raise SystemExit(0)

          data = json.loads(report.read_text())
          lines = [
              "## Eval gate",
              "",
              f"Provider: `{data['provider']}`",
              "",
              "| arm | pass | exact | partial | scope | brier | seg% | tools |",
              "|---|---|---|---|---|---|---|---|",
          ]
          for m in data["metrics"]:
              lines.append(
                  f"| {m['arm']} | {m['pass_index']} | {m['exact_match']:.0%} "
                  f"| {m['partial_credit']:.2f} | {m['scope_accuracy']:.0%} "
                  f"| {m['brier']:.3f} | {m['segmentation_rate']:.0%} "
                  f"| {m['mean_tool_calls']:.1f} |"
              )

          failed = sorted({c["case_id"] for c in data["cases"] if not (
              c["completed"] and c["scope_correct"]
              and c["gateway_correct"] and c["issuer_correct"])})
          lines += [
              "",
              f"**Cases not matched exactly:** {', '.join(failed) if failed else 'none'}",
              "",
              "> The baseline policy is expected to fail `diurnal_trough` and",
              "> `fleet_wide_partial` -- those two exist to keep the eval from",
              "> saturating. A score of 100% means the eval has lost its",
              "> discriminating power, not that the agent got better.",
          ]
          summary.write_text("\n".join(lines) + "\n")
          PY

      - name: Upload eval report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            results/eval_report.json
            results/eval_metrics.csv
            results/traces.jsonl
            eval-output.txt
          if-no-files-found: warn
          retention-days: 14
